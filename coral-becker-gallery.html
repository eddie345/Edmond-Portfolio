<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coral Becker Brand Flyers</title>
    <style>
        :root {
            --bg: #f5efe8;
            --ink: #10141a;
            --dark: #0a1d2b;
            --navy: #0d2440;
            --orange: #f28a27;
            --orange-deep: #eb5f26;
            --red: #d81f2d;
            --gold: #ffd25a;
            --paper: #f4efe8;
            --white: #fffdfb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #efe6dc;
            color: var(--ink);
        }

        .gallery-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            color: var(--ink);
            font-weight: 700;
            flex-wrap: wrap;
        }

        .brand-identity {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 280px;
        }

        .brand-identity img {
            width: 88px;
            height: 88px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 14px 30px rgba(16, 20, 26, 0.12);
            border: 1px solid rgba(16, 20, 26, 0.08);
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title-block span {
            font-size: 0.74rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.72;
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.07em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, #10141a, #2c3b52);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 16px 30px rgba(16, 20, 26, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 32px rgba(16, 20, 26, 0.24);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }

        .flyer {
            position: relative;
            min-height: 460px;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(15, 19, 25, 0.12);
            background: var(--white);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .flyer img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
        }

        .flyer-1 {
            background: #efe9e2;
            color: var(--navy);
        }

        .flyer-1::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.01));
        }

        .brand-top {
            position: absolute;
            left: 24px;
            top: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 2.4rem;
            letter-spacing: -0.05em;
            z-index: 2;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f9a62c, #ea5b1d);
            position: relative;
            box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .brand-mark::before,
        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 7px 6px 7px 6px;
            border-radius: 50%;
            background: #fff;
            clip-path: circle(40% at 50% 50%);
        }

        .brand-mark::after {
            inset: 0;
            background: transparent;
            border: 3px solid #fff;
            border-top-color: transparent;
            border-left-color: transparent;
            transform: rotate(45deg);
        }

        .brand-tag {
            position: absolute;
            right: 26px;
            top: 30px;
            font-size: 1.35rem;
            font-weight: 700;
            z-index: 2;
        }

        .photo-stage {
            position: absolute;
            left: 0;
            right: 0;
            top: 72px;
            bottom: 0;
            background: rgba(255, 255, 255, 0.15);
        }

        .photo-stage .art {
            position: absolute;
            width: 72%;
            height: 68%;
            right: -8%;
            bottom: 18%;
            background: rgba(247, 157, 39, 0.9);
            border-radius: 44% 56% 52% 48% / 36% 28% 72% 64%;
            transform: rotate(18deg);
            box-shadow: inset 0 0 0 22px rgba(255, 255, 255, 0.08);
        }

        .photo-stage .figure {
            position: absolute;
            right: 12%;
            bottom: 6%;
            width: 42%;
            height: 60%;
            border-radius: 40% 40% 16% 16% / 26% 26% 12% 12%;
            background: linear-gradient(180deg, #f5a153, #d76521);
            transform: rotate(8deg);
            box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.04);
            opacity: 0.9;
        }

        .photo-stage .figure::before {
            content: "";
            position: absolute;
            width: 36%;
            height: 26%;
            left: 30%;
            top: -10%;
            background: #3b241a;
            border-radius: 50% 50% 46% 46%;
        }

        .flyer-1 .headline {
            position: absolute;
            left: 26px;
            bottom: 88px;
            font-size: clamp(2.7rem, 4vw, 5rem);
            line-height: 0.82;
            letter-spacing: -0.08em;
            font-weight: 900;
            text-transform: none;
            z-index: 2;
        }

        .flyer-1 .headline .accent {
            display: block;
            color: #ef7f1a;
        }

        .flyer-1 .sub {
            position: absolute;
            left: 28px;
            bottom: 32px;
            font-size: 1.2rem;
            line-height: 1.4;
            font-weight: 600;
            z-index: 2;
            max-width: 280px;
            color: rgba(16, 20, 26, 0.85);
        }

        .flyer-2 {
            background: #f4efe7;
            color: var(--ink);
        }

        .flyer-2 .headline {
            position: absolute;
            left: 16px;
            top: 16px;
            right: 16px;
            font-size: clamp(4rem, 7vw, 9rem);
            line-height: 0.82;
            letter-spacing: -0.08em;
            font-weight: 900;
            text-align: center;
            z-index: 2;
            color: #1d1a1a;
        }

        .flyer-2 .headline .accent {
            display: block;
            color: #d93b1c;
        }

        .flyer-2 .face {
            position: absolute;
            left: 50%;
            bottom: 10%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(180deg, #6e4d3c, #34251f 60%, #140d0d 100%);
            box-shadow: 0 18px 26px rgba(0, 0, 0, 0.12);
            z-index: 2;
            overflow: visible;
        }

        .flyer-2 .face::before {
            content: "";
            position: absolute;
            inset: 12% 18% 18% 18%;
            border-radius: 50%;
            background: linear-gradient(180deg, #d9a77c, #b66f4c 65%, #6e3d2f 100%);
            box-shadow: inset 0 0 0 8px rgba(0, 0, 0, 0.03);
        }

        .flyer-2 .face::after {
            content: "";
            position: absolute;
            inset: auto 20% 4% 20%;
            height: 18%;
            border-radius: 50%;
            background: rgba(28, 28, 28, 0.5);
            filter: blur(18px);
        }

        .flyer-2 .tag {
            position: absolute;
            left: 18px;
            top: 18px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #1d1a1a;
        }

        .flyer-2 .side-note {
            position: absolute;
            right: 20px;
            top: 160px;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            font-weight: 800;
            color: #1d1a1a;
            z-index: 2;
        }

        .flyer-2 .bottom-note {
            position: absolute;
            right: 24px;
            bottom: 36px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #d93b1c;
            z-index: 2;
        }

        .flyer-2 .bottom-note strong {
            display: block;
            font-size: 2rem;
            letter-spacing: -0.05em;
        }

        .flyer-3 {
            background: linear-gradient(135deg, #5f0d11 0%, #b6151b 38%, #d9371b 100%);
            color: white;
        }

        .flyer-3 .badge {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 170px;
            padding: 10px 16px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            font-weight: 700;
            z-index: 2;
        }

        .flyer-3 .portrait {
            position: absolute;
            left: 50%;
            bottom: 14%;
            transform: translateX(-50%);
            width: 360px;
            height: 420px;
            border-radius: 50% 50% 15% 15% / 40% 40% 12% 12%;
            background: linear-gradient(180deg, #6e4d3d, #201920 57%, #0b0c10 100%);
            z-index: 2;
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.22);
        }

        .flyer-3 .portrait::before {
            content: "";
            position: absolute;
            inset: 10% 18% 16% 18%;
            border-radius: 45% 45% 35% 35%;
            background: linear-gradient(180deg, #cf896d, #a8634c 52%, #613d2a 100%);
        }

        .flyer-3 .title {
            position: absolute;
            left: 50%;
            top: 132px;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 2;
        }

        .flyer-3 .big {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            text-align: center;
            font-weight: 900;
            letter-spacing: -0.08em;
            z-index: 2;
            font-size: clamp(3.8rem, 8vw, 8rem);
            line-height: 0.8;
        }

        .flyer-3 .big .small {
            display: block;
            font-size: 0.6em;
            letter-spacing: 0.02em;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .flyer-4 {
            background: linear-gradient(180deg, #f3e7df, #f8f1eb 35%, #f0e3da 100%);
            color: var(--ink);
        }

        .flyer-4 .topline {
            position: absolute;
            left: 18px;
            right: 18px;
            top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            z-index: 2;
        }

        .flyer-4 .topline .brand {
            font-size: 2.2rem;
            letter-spacing: -0.06em;
        }

        .flyer-4 .headline {
            position: absolute;
            left: 0;
            right: 0;
            top: 74px;
            text-align: center;
            font-size: clamp(3rem, 5vw, 5.5rem);
            line-height: 0.85;
            letter-spacing: -0.07em;
            font-weight: 900;
            z-index: 2;
        }

        .flyer-4 .headline .accent {
            display: block;
            color: rgba(195, 37, 30, 0.9);
        }

        .flyer-4 .brand-card {
            position: absolute;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -48%);
            width: 72%;
            height: 52%;
            background: linear-gradient(180deg, #eb5a2b, #ca3325);
            border-radius: 22px;
            box-shadow: 0 16px 34px rgba(128, 31, 18, 0.2);
            overflow: hidden;
        }

        .flyer-4 .brand-card::before {
            content: "";
            position: absolute;
            inset: 12% 22% 22% 22%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .flyer-4 .brand-card .person {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            width: 200px;
            height: 220px;
            border-radius: 50% 50% 20% 20% / 38% 38% 10% 10%;
            background: linear-gradient(180deg, #c7875a 0%, #85553b 38%, #221a18 100%);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .flyer-4 .brand-card .person::before {
            content: "";
            position: absolute;
            left: 22%;
            top: -18%;
            width: 56%;
            height: 28%;
            border-radius: 50%;
            background: #1f160f;
        }

        .flyer-4 .foot-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 18px 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.05));
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(17, 20, 25, 0.82);
            z-index: 2;
        }

        .flyer-5 {
            background: linear-gradient(135deg, #eeefe8, #f8f0eb 33%, #e6d8cf 100%);
            color: var(--ink);
        }

        .flyer-5 .lockup {
            position: absolute;
            left: 32px;
            top: 26px;
            font-size: clamp(1.8rem, 4vw, 3.6rem);
            letter-spacing: -0.06em;
            font-weight: 900;
            z-index: 2;
        }

        .flyer-5 .lockup span {
            display: block;
            color: #d3202f;
        }

        .flyer-5 .food-bag {
            position: absolute;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 240px;
            border-radius: 18px;
            background: linear-gradient(180deg, #f5ce4a 0%, #f0aa1a 100%);
            box-shadow: 0 22px 34px rgba(87, 56, 6, 0.18);
            z-index: 2;
        }

        .flyer-5 .food-bag::before {
            content: "";
            position: absolute;
            inset: 18px 22px 26px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .flyer-5 .food-bag::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 240px;
            height: 120px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
        }

        .flyer-5 .small-1,
        .flyer-5 .small-2,
        .flyer-5 .small-3 {
            position: absolute;
            display: block;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            z-index: 2;
        }

        .flyer-5 .small-1 {
            left: 10%;
            top: 50%;
        }

        .flyer-5 .small-2 {
            right: 12%;
            top: 30%;
        }

        .flyer-5 .small-3 {
            right: 18%;
            bottom: 18%;
        }

        .flyer-5 .bottom-strip {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(215, 34, 38, 0.95);
            padding: 18px 20px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            z-index: 3;
        }

        .flyer-5 .bottom-strip strong {
            display: block;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
            text-transform: none;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .gallery-shell {
                padding: 24px 14px 40px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .flyer {
                min-height: 390px;
            }
        }
    </style>
</head>

<body>
    <div class="gallery-shell">
        <div class="page-header">
            <div class="brand-identity">
                <img src="assets/brand.jpg" alt="Coral Becker Brand" />
                <div class="title-block">
                    <span>Brand identity</span>
                    <h1>Coral Becker Brand</h1>
                </div>
            </div>

            <div class="header-actions">
                <a id="backButton" class="back-button" href="index.html" aria-label="Go back to previous page">←
                    Back</a>
            </div>
        </div>

        <div class="gallery-grid">
            <article class="flyer" aria-label="Flyer 1">
                <img src="assets/gr%201.jpg" alt="Coral Becker flyer 1" />
            </article>

            <article class="flyer" aria-label="Flyer 2">
                <img src="assets/gr%202.jpg" alt="Coral Becker flyer 2" />
            </article>

            <article class="flyer" aria-label="Flyer 3">
                <img src="assets/gr%203.jpg" alt="Coral Becker flyer 3" />
            </article>

            <article class="flyer" aria-label="Flyer 4">
                <img src="assets/gr%204.jpg" alt="Coral Becker flyer 4" />
            </article>

            <article class="flyer" aria-label="Flyer 5">
                <img src="assets/gr%205.jpg" alt="Coral Becker flyer 5" />
            </article>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const backButton = document.getElementById('backButton');

            if (!backButton) return;

            backButton.addEventListener('click', (event) => {
                event.preventDefault();

                if (document.referrer && document.referrer !== window.location.href) {
                    window.history.back();
                    return;
                }

                window.location.href = 'index.html';
            });
        });
    </script>
</body>

</html>
